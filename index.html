<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Measurements Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f6f3;
    color: #1a1a18;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e5e3dc;
    padding: 2rem;
    width: 100%;
    max-width: 980px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1.75rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a18;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 13px;
    color: #888780;
  }

  .unit-toggle {
    display: flex;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .unit-btn {
    padding: 7px 16px;
    font-size: 13px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #888780;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }

  .unit-btn.active {
    background: #f1efe8;
    color: #1a1a18;
    font-weight: 500;
  }

  .table-wrap {
    overflow-x: auto;
    margin-bottom: 1rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  thead th {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #888780;
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid #e5e3dc;
  }

  thead th:first-child { text-align: left; }

  tbody tr:hover { background: #f7f6f3; }

  tbody td { padding: 4px 4px; }

  tbody td input {
    width: 100%;
    padding: 7px 8px;
    font-size: 13px;
    font-family: inherit;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: #1a1a18;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }

  tbody td input[type="date"] {
    text-align: left;
    font-size: 12px;
    min-width: 120px;
  }

  tbody td input:focus {
    outline: none;
    border-color: #b4b2a9;
    background: #fff;
  }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #b4b2a9;
    font-size: 15px;
    padding: 6px 8px;
    border-radius: 6px;
    line-height: 1;
    transition: color 0.15s;
  }

  .del-btn:hover { color: #c0392b; }

  .add-btn {
    margin-top: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: transparent;
    color: #888780;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .add-btn:hover {
    background: #f1efe8;
    color: #1a1a18;
  }

  .divider {
    border: none;
    border-top: 1px solid #e5e3dc;
    margin: 1.5rem 0;
  }

  .notes-label {
    font-size: 12px;
    font-weight: 500;
    color: #888780;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    font-size: 13px;
    font-family: inherit;
    color: #1a1a18;
    background: #f7f6f3;
    border: 1px solid #e5e3dc;
    border-radius: 8px;
    padding: 10px 12px;
    resize: vertical;
    min-height: 72px;
    transition: border-color 0.15s;
  }

  textarea:focus {
    outline: none;
    border-color: #b4b2a9;
    background: #fff;
  }

  .save-bar {
    display: flex;
    gap: 12px;
    margin-top: 1.25rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .save-btn {
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #f1efe8;
    color: #1a1a18;
    cursor: pointer;
    transition: background 0.15s;
  }

  .save-btn:hover { background: #e5e3dc; }

  .print-btn {
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: transparent;
    color: #888780;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .print-btn:hover { background: #f1efe8; color: #1a1a18; }

  .save-hint {
    font-size: 12px;
    color: #3B6D11;
    font-weight: 500;
  }

  @media print {
    body { background: white; padding: 0; }
    .card { box-shadow: none; border: none; padding: 1rem; }
    .unit-toggle, .add-btn, .del-btn, .save-bar { display: none; }
    tbody td input { border: none; }
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; }
    .card { background: #2c2c2a; border-color: #444441; }
    .header h1 { color: #f1efe8; }
    .header p, thead th, .notes-label { color: #888780; }
    tbody td input, textarea { color: #f1efe8; }
    tbody td input:focus, textarea:focus { background: #1a1a18; }
    textarea { background: #1a1a18; border-color: #444441; }
    tbody tr:hover { background: #1a1a18; }
    .add-btn, .print-btn { color: #888780; border-color: #444441; }
    .add-btn:hover, .print-btn:hover { background: #444441; color: #f1efe8; }
    .save-btn { background: #444441; color: #f1efe8; border-color: #5f5e5a; }
    .save-btn:hover { background: #5f5e5a; }
    .unit-btn.active { background: #444441; color: #f1efe8; }
    .unit-toggle { border-color: #444441; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <h1>Body measurements</h1>
      <p>Add a row for each date you measure</p>
    </div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-in" onclick="setUnit('in')">inches</button>
      <button class="unit-btn" id="btn-cm" onclick="setUnit('cm')">cm</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Bust</th>
          <th>Waist</th>
          <th>Hips</th>
          <th>Thigh</th>
          <th>Upper arm</th>
          <th>Inseam</th>
          <th>Height</th>
          <th>Weight</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <button class="add-btn" onclick="addRow()">+ Add row</button>

  <hr class="divider">

  <label class="notes-label" for="notes">Notes</label>
  <textarea id="notes" placeholder="e.g. morning measurements, post-workout, brand sizing notes..."></textarea>

  <div class="save-bar">
    <button class="save-btn" onclick="downloadCSV()">Download as CSV</button>
    <button class="print-btn" onclick="window.print()">Print</button>
    <span class="save-hint" id="save-hint"></span>
  </div>
</div>

<script>
  let unit = 'in';

  function setUnit(u) {
    unit = u;
    document.getElementById('btn-in').classList.toggle('active', u === 'in');
    document.getElementById('btn-cm').classList.toggle('active', u === 'cm');
  }

  function addRow(data) {
    const d = data || {};
    const today = new Date().toISOString().split('T')[0];
    const fields = ['bust','waist','hips','thigh','arm','inseam','height','weight'];

    const tr = document.createElement('tr');
    const id = 'row-' + Date.now() + Math.random();
    tr.id = id;

    const dateTd = document.createElement('td');
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = d.date || today;
    dateInput.dataset.field = 'date';
    dateTd.appendChild(dateInput);
    tr.appendChild(dateTd);

    fields.forEach(f => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.min = '0';
      inp.step = '0.1';
      inp.placeholder = '—';
      inp.value = d[f] || '';
      inp.dataset.field = f;
      td.appendChild(inp);
      tr.appendChild(td);
    });

    const delTd = document.createElement('td');
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '&#x2715;';
    del.title = 'Remove row';
    del.onclick = () => tr.remove();
    delTd.appendChild(del);
    tr.appendChild(delTd);

    document.getElementById('tbody').appendChild(tr);
  }

  function downloadCSV() {
    const rows = document.querySelectorAll('#tbody tr');
    const notes = document.getElementById('notes').value;
    const weightUnit = unit === 'in' ? 'lbs' : 'kg';
    const headers = ['Date', `Bust (${unit})`, `Waist (${unit})`, `Hips (${unit})`, `Thigh (${unit})`, `Upper arm (${unit})`, `Inseam (${unit})`, `Height (${unit})`, `Weight (${weightUnit})`];
    const fieldKeys = ['date','bust','waist','hips','thigh','arm','inseam','height','weight'];

    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
      const vals = fieldKeys.map(k => {
        const inp = row.querySelector(`[data-field="${k}"]`);
        return inp ? (inp.value || '') : '';
      });
      csv += vals.join(',') + '\n';
    });
    if (notes.trim()) {
      csv += '\nNotes:,"' + notes.replace(/"/g, '""') + '"\n';
    }

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'body_measurements.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const hint = document.getElementById('save-hint');
    hint.textContent = 'Downloaded!';
    setTimeout(() => hint.textContent = '', 2500);
  }

  addRow();
</script>
</body>
</html>
