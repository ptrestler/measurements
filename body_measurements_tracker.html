
<style>
h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.tracker { padding: 1rem 0; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.header-left h3 { margin: 0; font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
.header-left p { margin: 4px 0 0; font-size: 13px; color: var(--color-text-secondary); }
.unit-toggle { display: flex; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); overflow: hidden; }
.unit-btn { padding: 6px 14px; font-size: 13px; background: transparent; border: none; cursor: pointer; color: var(--color-text-secondary); }
.unit-btn.active { background: var(--color-background-secondary); color: var(--color-text-primary); font-weight: 500; }
.entries-header { display: grid; grid-template-columns: 110px repeat(8, 1fr) 36px; gap: 4px; padding: 6px 8px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 4px; }
.entry-row { display: grid; grid-template-columns: 110px repeat(8, 1fr) 36px; gap: 4px; padding: 4px 8px; align-items: center; border-radius: var(--border-radius-md); }
.entry-row:hover { background: var(--color-background-secondary); }
.entry-row input { width: 100%; padding: 5px 6px; font-size: 13px; background: transparent; border: 0.5px solid transparent; border-radius: 6px; color: var(--color-text-primary); text-align: center; box-sizing: border-box; }
.entry-row input:focus { border-color: var(--color-border-secondary); background: var(--color-background-primary); outline: none; }
.entry-row input[type="date"] { text-align: left; font-size: 12px; padding: 5px 4px; }
.del-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); font-size: 14px; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; opacity: 0.5; }
.del-btn:hover { opacity: 1; color: var(--color-text-danger, #c33); }
.add-btn { margin-top: 12px; padding: 8px 16px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
.add-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.notes-row { margin-top: 1.5rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1rem; }
.notes-row label { font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
.notes-row textarea { width: 100%; font-size: 13px; color: var(--color-text-primary); background: transparent; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 8px; resize: vertical; min-height: 60px; box-sizing: border-box; }
.notes-row textarea:focus { outline: none; border-color: var(--color-border-secondary); }
.save-bar { display: flex; gap: 8px; margin-top: 1rem; align-items: center; }
.save-btn { padding: 8px 20px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); cursor: pointer; }
.save-btn:hover { background: var(--color-background-tertiary); }
.save-hint { font-size: 12px; color: var(--color-text-secondary); }
</style>

<h2 class="sr-only">Body measurements tracker — log dates and measurements for bust, waist, hips, thigh, upper arm, inseam, and height</h2>

<div class="tracker">
  <div class="header">
    <div class="header-left">
      <h3>Body measurements</h3>
      <p>Add a row for each date you measure</p>
    </div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-in" onclick="setUnit('in')">inches</button>
      <button class="unit-btn" id="btn-cm" onclick="setUnit('cm')">cm</button>
    </div>
  </div>

  <div class="entries-header">
    <span>Date</span>
    <span>Bust</span>
    <span>Waist</span>
    <span>Hips</span>
    <span>Thigh</span>
    <span>Upper arm</span>
    <span>Inseam</span>
    <span>Height</span>
    <span>Weight</span>
    <span></span>
  </div>

  <div id="rows"></div>

  <button class="add-btn" onclick="addRow()">+ Add row</button>

  <div class="notes-row">
    <label>Notes</label>
    <textarea id="notes" placeholder="e.g. morning measurements, post-workout, brand sizing notes..."></textarea>
  </div>

  <div class="save-bar">
    <button class="save-btn" onclick="downloadCSV()">Download as CSV</button>
    <span class="save-hint" id="save-hint"></span>
  </div>
</div>

<script>
let unit = 'in';
let rows = [];

function setUnit(u) {
  unit = u;
  document.getElementById('btn-in').classList.toggle('active', u === 'in');
  document.getElementById('btn-cm').classList.toggle('active', u === 'cm');
  document.querySelectorAll('.unit-label').forEach(el => el.textContent = u);
}

function addRow(data) {
  const id = Date.now() + Math.random();
  const d = data || {};
  rows.push(id);

  const today = new Date().toISOString().split('T')[0];
  const fields = ['bust','waist','hips','thigh','arm','inseam','height','weight'];

  const row = document.createElement('div');
  row.className = 'entry-row';
  row.id = 'row-' + id;

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = d.date || today;
  dateInput.dataset.field = 'date';
  row.appendChild(dateInput);

  fields.forEach(f => {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = '0';
    inp.step = '0.1';
    inp.placeholder = '—';
    inp.value = d[f] || '';
    inp.dataset.field = f;
    row.appendChild(inp);
  });

  const del = document.createElement('button');
  del.className = 'del-btn';
  del.innerHTML = '&#x2715;';
  del.title = 'Remove row';
  del.onclick = () => {
    row.remove();
    rows = rows.filter(r => r !== id);
  };
  row.appendChild(del);

  document.getElementById('rows').appendChild(row);
}

function getRowData() {
  const data = [];
  document.querySelectorAll('.entry-row').forEach(row => {
    const obj = {};
    row.querySelectorAll('input').forEach(inp => {
      if (inp.dataset.field) obj[inp.dataset.field] = inp.value;
    });
    data.push(obj);
  });
  return data;
}

function downloadCSV() {
  const data = getRowData();
  const notes = document.getElementById('notes').value;
  const headers = ['Date', `Bust (${unit})`, `Waist (${unit})`, `Hips (${unit})`, `Thigh (${unit})`, `Upper arm (${unit})`, `Inseam (${unit})`, `Height (${unit})`, `Weight (${unit === 'in' ? 'lbs' : 'kg'})`];
  const fieldKeys = ['date','bust','waist','hips','thigh','arm','inseam','height','weight'];

  let csv = headers.join(',') + '\n';
  data.forEach(row => {
    csv += fieldKeys.map(k => row[k] || '').join(',') + '\n';
  });
  if (notes) csv += '\nNotes:,' + notes.replace(/,/g, ';').replace(/\n/g, ' ') + '\n';

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'body_measurements.csv';
  a.click();
  URL.revokeObjectURL(url);

  const hint = document.getElementById('save-hint');
  hint.textContent = 'Downloaded!';
  setTimeout(() => hint.textContent = '', 2500);
}

addRow();
</script>
